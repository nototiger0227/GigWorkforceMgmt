services:
  postgres:
    image: postgres:16-alpine
    container_name: gig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gig
      POSTGRES_PASSWORD: gig_dev_password
      POSTGRES_DB: gig_workforce
    ports:
      - "5433:5432"
    volumes:
      - gig_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gig -d gig_workforce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gig-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gig_postgres_data:
